name: Build and Auto Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release WizFile Ultra
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Application (Release)
      run: dotnet build WizFileUltra.csproj -c Release

    - name: Package Release ZIP
      shell: pwsh
      run: |
        $outDir = Get-ChildItem -Path "bin/Release" -Directory | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "Output Directory: $outDir"
        New-Item -ItemType Directory -Path "dist" -Force
        Copy-Item "$outDir/*" -Destination "dist" -Recurse
        Compress-Archive -Path "dist/*" -DestinationPath "WizFileUltra-v1.0.0.zip" -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WizFileUltra-Release
        path: bin/Release/net48/WizFileUltra.exe

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "WizFile Ultra v1.0.0 - (Türkçe / English Multi-Lang Release)"
        body: |
          🚀 **WizFile Ultra v1.0.0 Yayınlandı!**
          
          WizFile ve Everything mantığında, NTFS MFT tabanlı ultra hızlı dosya ve klasör arama aracı.
          
          ### 🌟 Özellikler:
          - ⏱ **Son X Dakikada Değişenler**: 10 dk, 30 dk, 60 dk gibi sürelerle filtreleme.
          - 🔄 **Canlı Sürekli Otomatik Yenileme**: Arka planda anlık dosya takibi.
          - 🗂️ **Hazır Kategoriler**: Kod/Yazı, Resim, Video, Belge, Arşiv, Müzik.
          - 🌐 **Çoklu Dil (Multi-Language)**: Tek tıkla Türkçe (TR) ve İngilizce (EN) geçişi.
          - 📄 **Varsayılan Yazı & Kod Formatları**: `.txt .cpp .h .cs .py .js .ts .html .json .xml .md .log`
          - 📁 **Detaylı Klasör Adı Araması**: Dosya adından bağımsız klasör yolu arama.
          - ➕ **Çoklu Klasör Filtreleme (+ Rozetler)**: Birden çok klasör ekleyip çıkarma.
          - ⚡ **Tüm Dosyaları Baştan Tara**: NTFS MFT / USN Journal okuyucusu.
          
          ### 📥 İndir:
          - Doğrudan **`WizFileUltra.exe`** veya **`WizFileUltra-v1.0.0.zip`** dosyasını aşağıdaki Assets bölümünden indirebilirsiniz.
        files: |
          bin/Release/net48/WizFileUltra.exe
          WizFileUltra-v1.0.0.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
